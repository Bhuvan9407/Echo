<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo | Secure Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    /* --- Your Exact Landing Page Variables --- */
    :root {
      --bg: #f7f9f8;
      --surface: #ffffff;
      --ink: #17201d;
      --muted: #68746f;
      --primary: #176b5b;
      --primary-dark: #0e4b40;
      --accent: #8b7cf6;
      --soft-green: #ddf3ec;
      --soft-purple: #eae7ff;
      --danger: #d9534f;
      --line: rgba(23, 32, 29, 0.1);
      --shadow: 0 24px 70px rgba(14, 75, 64, 0.13);
    }

    body {
      margin: 0;
      font-family: Manrope, Inter, system-ui, -apple-system, sans-serif;
      /* Your exact radial gradient background */
      background:
        radial-gradient(circle at 18% 10%, rgba(221, 243, 236, 0.9), transparent 34rem),
        radial-gradient(circle at 86% 4%, rgba(234, 231, 255, 0.92), transparent 32rem),
        linear-gradient(180deg, #fbfcfb 0%, var(--bg) 42%, #f2f7f4 100%);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Custom Scrollbar for Light Mode --- */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(23, 32, 29, 0.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(23, 32, 29, 0.3); }

    /* --- Floating Header (Matching .site-header) --- */
    header {
      margin: 16px auto 0;
      width: min(1120px, calc(100% - 32px));
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 50px rgba(14, 75, 64, 0.11);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--line);
      border-radius: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand { font-weight: 800; font-size: 1.2rem; font-family: Inter, sans-serif; }
    .brand span { font-weight: 700; font-size: 0.85rem; color: var(--muted); margin-left: 8px; }
    
    .user-info { display: flex; align-items: center; gap: 20px; font-size: 0.93rem; color: var(--muted); font-weight: 700; }
    #user-alias { color: var(--primary); font-weight: 800; }
    
    #logout-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 8px 16px;
      border-radius: 22px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #logout-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* --- Chat Container --- */
    #chat-container {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    
    /* --- Message Bubbles (Matching .bubble & .mini-bubble) --- */
    .message {
      padding: 14px 16px;
      border-radius: 18px;
      max-width: 75%;
      word-wrap: break-word;
      font-size: 0.95rem;
      line-height: 1.5;
      animation: fadeIn 0.3s ease forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.sent {
      background: var(--primary);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 8px;
      box-shadow: 0 14px 30px rgba(14, 75, 64, 0.1);
    }
    
    .message.ai-translated, .typing-indicator {
      background: #f3f7f5;
      border: 1px solid var(--line);
      color: var(--ink);
      align-self: flex-start;
      border-bottom-left-radius: 8px;
    }

    .safety-flag {
      font-size: 0.75rem;
      color: var(--danger);
      background: rgba(217, 83, 79, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 8px;
      display: inline-block;
      font-weight: 800;
      border: 1px solid rgba(217, 83, 79, 0.2);
    }

    /* --- Input Area --- */
    #input-wrapper {
      padding: 20px;
      background: linear-gradient(to top, rgba(247, 249, 248, 1) 40%, rgba(247, 249, 248, 0));
    }

    #input-area {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line);
      padding: 10px;
      border-radius: 22px;
      box-shadow: 0 22px 50px rgba(14, 75, 64, 0.13);
    }

    #message-input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 22px;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 0.95rem;
      font-family: inherit;
    }
    #message-input:focus { outline: none; }
    #message-input::placeholder { color: var(--muted); }

    /* Match the soft-green accents for dropdown */
    select {
      background: var(--soft-green);
      color: var(--primary-dark);
      border: 1px solid transparent;
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: var(--primary); }

    /* Match the primary button style */
    button[type="submit"] {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      padding: 0 24px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 16px 28px rgba(14, 75, 64, 0.16);
    }
    button[type="submit"]:hover {
      transform: translateY(-2px);
    }

    /* --- Typing Indicator Animation --- */
    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 16px 20px;
      width: fit-content;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes blink {
      0% { opacity: 0.3; transform: scale(0.8); }
      20% { opacity: 1; transform: scale(1.2); background: var(--primary); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Echo <span>Secure Room</span></div>
    <div class="user-info">
      <span>Logged in as <span id="user-alias">Loading...</span></span>
      <button id="logout-btn">Logout</button>
    </div>
  </header>

  <div id="chat-container">
    <!-- Messages appear here -->
  </div>

  <div id="input-wrapper">
    <form id="input-area">
      <input type="text" id="message-input" placeholder="Type your message securely..." required autocomplete="off">
      
      <!-- Target Language -->
      <select id="target-language">
        <option value="en">English</option>
        <option value="hi">Hindi (हिंदी)</option>
        <option value="bn">Bengali (বাংলা)</option>
        <option value="te">Telugu (తెలుగు)</option>
        <option value="mr">Marathi (मराठी)</option>
        <option value="ta">Tamil (தமிழ்)</option>
        <option value="ur">Urdu (اردو)</option>
        <option value="gu">Gujarati (ગુજરાતી)</option>
        <option value="kn">Kannada (ಕನ್ನಡ)</option>
        <option value="ml">Malayalam (മലയാളം)</option>
        <option value="or">Odia (ଓଡ଼ିଆ)</option>
        <option value="pa">Punjabi (ਪੰਜਾਬੀ)</option>
        <option value="as">Assamese (অসমীয়া)</option>
        <option value="mai">Maithili (मैथिली)</option>
        <option value="sat">Santali (ᱥᱟᱱᱛᱟᱲᱤ)</option>
        <option value="ks">Kashmiri (कॉशुर)</option>
        <option value="ne">Nepali (नेपाली)</option>
        <option value="kok">Konkani (कोंकणी)</option>
        <option value="sd">Sindhi (سنڌي)</option>
        <option value="doi">Dogri (डोगरी)</option>
        <option value="mni">Manipuri (ꯃꯤꯇꯩꯂꯣꯟ)</option>
        <option value="brx">Bodo (बड़ो)</option>
        <option value="sa">Sanskrit (संस्कृतम्)</option>
      </select>
      
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="assets/js/chat.js"></script>
</body>
</html>
