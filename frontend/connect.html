<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo | Connecting...</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column; 
      justify-content: center; align-items: center; background: #f7f9f8;
      font-family: 'Inter', sans-serif; overflow: hidden;
    }
    
    .radar-container {
      position: relative; width: 300px; height: 300px;
      display: flex; justify-content: center; align-items: center;
    }

    .pulse-ring {
      position: absolute; width: 100%; height: 100%;
      border-radius: 50%; border: 2px solid rgba(23, 107, 91, 0.2);
      animation: expand 3s infinite ease-out;
    }
    .pulse-ring:nth-child(2) { animation-delay: 1s; }
    .pulse-ring:nth-child(3) { animation-delay: 2s; }

    .avatar {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center; 
      font-weight: 900; font-size: 1rem; z-index: 5;
      box-shadow: 0 14px 30px rgba(14, 75, 64, 0.15);
    }
    .user { background: #176b5b; color: #fff; }
    
    .peer { 
      background: #8b7cf6; color: #fff; opacity: 0;
      transform: translate(100px, -90px);
      animation: appear 0.5s forwards; animation-delay: 2.5s;
    }

    h2 { color: #0e4b40; margin-top: 50px; text-align: center; font-size: 1.8rem; }
    p { color: #68746f; margin-top: -10px; font-weight: 700; }

    @keyframes expand {
      0% { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @keyframes appear {
      to { opacity: 1; transform: translate(80px, -70px) scale(1.1); }
    }
  </style>
</head>
<body>

  <div class="radar-container">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    
    <div class="avatar user">You</div>
    <div class="avatar peer">Peer</div>
  </div>

  <h2 id="status-text">Finding a supportive peer...</h2>
  <p id="sub-text">Analyzing your assessment to find the best match.</p>

  <script>
    setTimeout(() => {
      document.getElementById('status-text').innerText = "Match Found!";
      document.getElementById('sub-text').innerText = "Connecting you to a secure room...";
      
      setTimeout(() => {
        window.location.href = "chat.html";
      }, 1500);
    }, 2500); 
  </script>
</body>
</html>
